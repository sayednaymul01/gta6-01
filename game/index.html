<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Solace: Neon Tide</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1526; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the line screen readers announce as the game changes. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Port Solace: Neon Tide. Walk with W A S D, drive with the arrow keys, F gets in and out of cars, Space punches, click shoots, E talks and uses."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
